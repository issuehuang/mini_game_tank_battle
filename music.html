        function base64ToArrayBuffer(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes.buffer;
        }

        const button = document.getElementById('play-button');
        const statusEl = document.getElementById('status');
        let activeNodes = [];

        button.addEventListener('click', async () => {
            // 避免重複點擊時疊加播放，造成音量爆掉、更刺耳
            if (button.disabled) return;
            button.disabled = true;
            statusEl.textContent = '載入中…';

            // 1. 必備：瀏覽器安全政策要求使用者互動後才能啟動音訊
            await Tone.start();

            // 2. 解析內嵌的 MIDI（右手旋律 / 左手伴奏 / 合唱襯底三軌）
            const midi = new Midi(base64ToArrayBuffer(MIDI_BASE64));
            statusEl.textContent = `播放中… 共 ${midi.tracks.filter(t => t.notes.length).length} 軌，長度 ${midi.duration.toFixed(1)} 秒`;

            // 主輸出加一個限幅器，避免三軌一起彈時爆音刺耳
            const limiter = new Tone.Limiter(-3).toDestination();
            const reverb = new Tone.Reverb({ decay: 1.6, wet: 0.15 }).connect(limiter);

            midi.tracks.forEach(track => {
                if (!track.notes.length) return; // 跳過 control track 跟純歌詞的空軌

                let synth;
                if (track.name.includes('right')) {
                    // 右手旋律：三角波，音色乾淨好辨識
                    synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: 'triangle' },
                        envelope: { attack: 0.005, decay: 0.2, sustain: 0.15, release: 0.3 },
                    });
                    synth.volume.value = -10;
                    synth.connect(reverb);
                } else if (track.name.includes('left')) {
                    // 左手伴奏：稍暗一點的三角波，音量略低不搶戲
                    synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: 'triangle' },
                        envelope: { attack: 0.01, decay: 0.2, sustain: 0.2, release: 0.3 },
                    });
                    synth.volume.value = -16;
                    synth.connect(limiter);
                } else {
                    // 合唱襯底（choir aahs）：正弦波、慢起音，營造氣勢但不刺耳
                    synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: 'sine' },
                        envelope: { attack: 0.3, decay: 0.3, sustain: 0.6, release: 0.8 },
                    });
                    synth.volume.value = -14;
                    synth.connect(reverb);
                }

                const part = new Tone.Part((time, note) => {
                    synth.triggerAttackRelease(note.name, note.duration, time, note.velocity);
                }, track.notes.map(n => [n.time, n])).start(0);

                activeNodes.push(part, synth);
            });
            activeNodes.push(limiter, reverb);

            // 3. 啟動播放器時間軸（音符時間是 MIDI 原始秒數，不受 Transport BPM 影響）
            Tone.getTransport().start();

            // 播完後自動停止、釋放資源
            Tone.getTransport().scheduleOnce(() => {
                Tone.getTransport().stop();
                Tone.getTransport().cancel();
                activeNodes.forEach(n => n.dispose && n.dispose());
                activeNodes = [];
                statusEl.textContent = '播放完畢';
                button.disabled = false;
            }, midi.duration + 1);
        });
