<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>TANK BATTLE — three.js demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d16; cursor: crosshair; }
  #hud {
    position: fixed; top: 16px; left: 16px; color: #e8e6d8;
    font-family: "Courier New", monospace; user-select: none; pointer-events: none;
  }
  #hpbar { width: 180px; height: 12px; border: 2px solid #e8e6d8; margin-top: 6px; }
  #hpfill { height: 100%; width: 100%; background: #7fbf5f; transition: width .15s; }
  #score { font-size: 20px; letter-spacing: 2px; }
  #buffs { margin-top: 6px; font-size: 13px; }
  #buffs div { margin-top: 2px; }
  #help {
    position: fixed; top: 56px; right: 20px; text-align: right;
    color: #e8e6d8; font-family: "Courier New", monospace; font-size: 13px;
    line-height: 1.7; user-select: none; pointer-events: none; white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; background: rgba(15, 17, 12, .78);
    color: #e8e6d8; font-family: "Courier New", monospace;
  }
  #overlay h1 { font-size: 42px; letter-spacing: 6px; margin: 0 0 10px; }
  #overlay p { margin: 4px 0 18px; color: #b0b49e; }
  #overlay button {
    font-family: inherit; font-size: 16px; letter-spacing: 2px; cursor: pointer;
    background: #7fbf5f; color: #1a1d16; border: none; padding: 10px 26px;
  }
  #overlay button:hover { background: #93d472; }
  #muteBtn {
    position: fixed; top: 16px; right: 20px; font-size: 22px;
    cursor: pointer; user-select: none; opacity: .8; filter: grayscale(.15);
  }
  #muteBtn:hover { opacity: 1; }
  #waveInfo { margin-top: 4px; color: #d9a441; letter-spacing: 1px; }
  #menu, #skillMenu {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; background: rgba(15, 17, 12, .92); text-align: center;
    color: #e8e6d8; font-family: "Courier New", monospace;
  }
  #menu h1, #skillMenu h1 { font-size: 40px; letter-spacing: 6px; margin: 0 0 6px; }
  #menu p, #skillMenu p { margin: 4px 0 18px; color: #b0b49e; }
  #menuButtons { display: flex; flex-direction: column; gap: 12px; }
  #menu button, #skillMenu button {
    font-family: inherit; font-size: 16px; letter-spacing: 2px; cursor: pointer;
    background: #7fbf5f; color: #1a1d16; border: none; padding: 10px 26px;
  }
  #menu button:hover, #skillMenu button:hover { background: #93d472; }
  #menu button:disabled {
    background: #4a4f40; color: #8a8f7a; cursor: not-allowed;
  }
  #skillRows { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; min-width: 300px; }
  .skillRow { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
  .skillRow .ctrl { display: flex; align-items: center; gap: 8px; }
  .skillRow button { padding: 2px 12px; font-size: 16px; }
  .skillRow .val { width: 22px; text-align: center; }

  #testMenu {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(15, 17, 12, .92); color: #e8e6d8; font-family: "Courier New", monospace;
  }
  #testPanel {
    max-height: 86vh; overflow-y: auto; padding: 28px 32px; text-align: left;
    background: #23271c; border: 1px solid #3a3f30; min-width: 320px;
  }
  #testPanel h1 { font-size: 26px; letter-spacing: 4px; margin: 0 0 18px; text-align: center; }
  #testPanel section { margin-bottom: 20px; }
  #testPanel h3 {
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #8a8f7a;
    margin: 0 0 10px; border-bottom: 1px solid #3a3f30; padding-bottom: 6px;
  }
  #testEnemyTypes { display: flex; gap: 18px; flex-wrap: wrap; }
  #testEnemyTypes label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
  #testLevelSelect {
    width: 100%; font-family: inherit; font-size: 14px; padding: 6px 8px;
    background: #1a1d16; color: #e8e6d8; border: 1px solid #3a3f30;
  }
  #testStatGrid { display: grid; grid-template-columns: 1fr 64px; row-gap: 10px; column-gap: 12px; align-items: center; }
  #testStatGrid label { font-size: 13px; color: #cfcabb; }
  #testStatGrid input {
    width: 64px; font-family: inherit; font-size: 14px; padding: 4px 6px; text-align: right;
    background: #1a1d16; color: #e8e6d8; border: 1px solid #3a3f30;
  }
  #testPanel button {
    font-family: inherit; font-size: 16px; letter-spacing: 2px; cursor: pointer;
    background: #7fbf5f; color: #1a1d16; border: none; padding: 10px 26px; width: 100%; margin-top: 4px;
  }
  #testPanel button:hover { background: #93d472; }
</style>
</head>
<body>
<div id="hud">
  <div id="score">SCORE 0</div>
  <div id="waveInfo"></div>
  <div id="hpbar"><div id="hpfill"></div></div>
  <div id="buffs"></div>
</div>
<div id="muteBtn" title="音樂/音效開關">🔊</div>
<div id="help">
  <div>WASD 移動 · 滑鼠瞄準</div>
  <div>點擊 / 空白鍵 開砲</div>
</div>
<div id="overlay">
  <h1>YOU DIED</h1>
  <p id="finalScore"></p>
  <button id="restart">RESTART</button>
</div>
<div id="menu">
  <h1>TANK BATTLE</h1>
  <p>選擇模式</p>
  <div id="menuButtons">
    <button id="modeEndless">無限亂鬥</button>
    <button id="modeSurvival">無限生存</button>
    <button id="modeCampaign" disabled>闖關模式（開發中）</button>
    <button id="modeTest">測試模式</button>
  </div>
</div>
<div id="skillMenu" style="display:none">
  <h1 id="skillMenuWave">WAVE CLEAR</h1>
  <p>剩餘點數：<span id="pointsLeft">0</span></p>
  <div id="skillRows"></div>
  <button id="skillConfirm">確認</button>
</div>
<div id="testMenu">
  <div id="testPanel">
    <h1>測試模式</h1>
    <section>
      <h3>敵人種類（可複選，至少選一種）</h3>
      <div id="testEnemyTypes">
        <label><input type="checkbox" value="standard" checked> 標準兵</label>
        <label><input type="checkbox" value="scout"> 偵查兵</label>
        <label><input type="checkbox" value="heavy"> 重裝兵</label>
      </div>
    </section>
    <section>
      <h3>關卡</h3>
      <select id="testLevelSelect"></select>
    </section>
    <section>
      <h3>玩家技能點數（直接套用，不用實際打波次累積）</h3>
      <div id="testStatGrid">
        <label for="testArmorFront">🛡 前方裝甲</label><input type="number" id="testArmorFront" value="0" min="0">
        <label for="testArmorBack">🛡 後方裝甲</label><input type="number" id="testArmorBack" value="0" min="0">
        <label for="testArmorLeft">🛡 左方裝甲</label><input type="number" id="testArmorLeft" value="0" min="0">
        <label for="testArmorRight">🛡 右方裝甲</label><input type="number" id="testArmorRight" value="0" min="0">
        <label for="testWeapon">⚔ 主武器火力</label><input type="number" id="testWeapon" value="0" min="0">
        <label for="testMissile">🚀 特殊武器火力</label><input type="number" id="testMissile" value="0" min="0">
      </div>
    </section>
    <button id="testStart">開始測試</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js",
  "tone": "https://esm.sh/tone@14.8.49",
  "@tonejs/midi": "https://esm.sh/@tonejs/midi@2.0.28"
} }
</script>
<script type="module" src="./src/game.js"></script>
</body>
</html>
